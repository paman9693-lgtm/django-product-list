<!DOCTYPE html>
<html>
<head>
    <title>Django Product Loop</title>
</head>
<body>
    <h2>Products</h2>
    <ul>
        {% for item in products %}
            <li>{{ forloop.counter }}. {{ item }}</li>
        {% empty %}
            <li>Koi product nahi mila.</li>
        {% endfor %}
    </ul>
</body>
</html>
